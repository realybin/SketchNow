name: Deploy to GitHub Releases

on: workflow_dispatch

defaults:
  run:
    shell: pwsh

env:
  release-repo: https://github.com/${{ github.repository }}

jobs:
  deploy-to-github-releases:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4.3.1
        with:
          dotnet-version: 10.0.x

      - name: Get Version from Project File
        id: get-version
        shell: bash
        run: echo "version=$(grep -oE '<Version>[^<]+' SketchNow/SketchNow.csproj | sed 's/<Version>//')" >> $GITHUB_OUTPUT
  
      - name: dotnet build
        run: dotnet build --configuration Release -p:Version="${{ steps.get-version.outputs.version }}"

      - name: dotnet test
        run: dotnet test --configuration Release --no-build --coverlet --coverlet-output-format cobertura --results-directory "${{github.workspace}}/.build/coverage"

      - name: ReportGenerator
        uses: danielpalme/ReportGenerator-GitHub-Action@5.5.12
        with:
          reports: ${{github.workspace}}/.build/coverage/**/coverage.cobertura*.xml
          targetdir: ${{github.workspace}}/.build/coveragereport/
          reporttypes: Html;MarkdownSummaryGithub
          title: 'Code Coverage'

      - name: Upload Code Coverage Report
        uses: actions/upload-artifact@v7.0.2
        with:
          name: CodeCoverage
          path: ${{github.workspace}}/.build/coveragereport/
          if-no-files-found: error

      - name: Publish Application
        run: dotnet publish SketchNow/SketchNow.csproj --runtime win-x64 --self-contained true --configuration Release -p:Version="${{ steps.get-version.outputs.version }}" -p:PublishDir="${{ github.workspace }}/.build/publish"

      - name: Restore Velopack CLI
        run: dotnet tool restore

      - name: Download previous Velopack release
        run: dotnet vpk download github --repoUrl "${{ env.release-repo }}" --channel win --outputDir "${{ github.workspace }}/.build/release"

      - name: Build Velopack packages
        run: dotnet vpk pack --packId SketchNow --packVersion ${{ steps.get-version.outputs.version }} --packDir "${{ github.workspace }}/.build/publish" --mainExe SketchNow.exe --runtime win-x64 --channel win --outputDir "${{ github.workspace }}/.build/release"

      - name: Upload Velopack release
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          dotnet vpk upload github --repoUrl "${{ env.release-repo }}" --channel win --outputDir "${{ github.workspace }}/.build/release" --releaseName "SketchNow ${{ steps.get-version.outputs.version }}" --tag v${{ steps.get-version.outputs.version }} --token "$env:RELEASE_TOKEN"
